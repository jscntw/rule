# -------------------------------------------------------------------
# 全局设置 (必须顶格)
# -------------------------------------------------------------------
mixed-port: 60890
redir-port: 60891
tproxy-port: 61536
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 1800
external-controller: 127.0.0.1:18181
external-ui: 
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
# always 开启，强制匹配所有进程
# strict 默认，由 Clash 判断是否开启
# off 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

tun:
  enable: false
  stack: system
  device: tun0
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true

dns:
  enable: true
  listen: 0.0.0.0:60666
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "rule-set:fake_ip"
  nameserver:
    - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24
    - 'https://cloudflare-dns.com/dns-query'
   # - 'https://[2001:4860:4860::8888]/dns-query'      # Google IPv6 DoH
   # - 'https://[2606:4700:4700::1111]/dns-query'      # Cloudflare IPv6 DoH	
   # - 'tls://[2001:4860:4860::8844]'
   # - 'tls://[2606:4700:4700::1001]'
  default-nameserver:
    - https://223.5.5.5/dns-query
   # - 'https://[2400:3200::1]/dns-query'              # 阿里 IPv6 DoH
   # - 'https://[2402:4e00::]/dns-query'               # 腾讯 IPv6 DoH
   # - '[2402:4e00::]'
   # - '[2400:3200::1]'
  nameserver-policy:
    "rule-set:AWAvenue-Ads":
      - rcode://refused  # 强制 DNS 阶段拒绝，这是最快的拦截方式
    "rule-set:private_domain,cn_domain":
      - 'https://dns.alidns.com/dns-query'
      - 'https://doh.pub/dns-query'
    # - 'https://[2400:3200::1]/dns-query'              # 阿里 IPv6 DoH
    # - 'https://[2402:4e00::]/dns-query'               # 腾讯 IPv6 DoH
    "rule-set:geolocation-!cn":
      - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24
     # - 'https://dns.google/dns-query'
      - 'https://cloudflare-dns.com/dns-query'
     # - 'https://[2001:4860:4860::8888]/dns-query'      # Google IPv6 DoH
     # - 'https://[2606:4700:4700::1111]/dns-query'      # Cloudflare IPv6 DoH		  
  proxy-server-nameserver:
    - https://doh.pub/dns-query
# ######## 锚点 end #######