# 基础设置
port: 20200
socks-port: 20201
mixed-port: 20202
redir-port: 20203
tproxy-port: 20204
allow-lan: true
bind-address: "*"
log-level: warning
mode: rule
# always 开启，强制匹配所有进程
# strict 默认，由 Clash 判断是否开启
# off 不匹配进程，推荐在路由器上使用此模式
find-process-mode: strict
ipv6: true
# ######## end #######
# ######## start ####### 
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 18  # 移动设置1800
# ######## end #######
# ######## start ####### 
external-controller: 0.0.0.0:18181
secret: ""
external-ui: ui
external-ui-name: m
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip" # "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
# ####################
# ######## start ####### 
geodata-mode: false
geodata-loader: standard
geo-auto-update: false
geo-update-interval: 168
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
# ######## end #######
