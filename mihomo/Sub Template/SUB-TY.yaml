# ######## start #######     
u: &u
  #type: select
  type: url-test
  use:
    - sub-1
    - sub-2
# ######## end #######
# ######## start #######
p: &p
  type: http
  # 自动更新订阅时间，单位为秒 100天
  interval: 8640000
  health-check:
    enable: true
    #url: https://cp.cloudflare.com
    url: https://www.gstatic.com/generate_204
    # 节点连通性检测时间，单位为秒
    interval: 300
    # 节点超时延迟，单位为毫秒
    timeout: 3000
    # 节点自动切换差值，单位为毫秒
    tolerance: 100
# ######## end #######
# ######## start #######     
proxy-providers:
  sub-1:
    <<: *p
    url: "https://sub"
    override:
      additional-prefix: "[p1]"
    path: "./proxy_provider/one.yaml"   
  sub-2:
    <<: *p
    url: "https://sub"
    override:
      additional-prefix: "[p2]"
    path: "./proxy_provider/two.yaml"
# ######## end #######
# ######## start ####### 
proxies:
  - {name: 🌎 DIRECT, type: direct, udp: true }
  - {name: DNS_Hijack, type: dns }
  - {name: ⚡️ctcc, type: direct, interface-name: pppoe-wan_ctcc}
  - {name: ⚡️cmcc, type: direct, interface-name: eth1}
# ######## end #######
# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
pr:
  &pr {
    type: select,
    proxies:
      [
        🚀 🇺🇲-ss,
        🚀 🇯🇵-ss,
        🚀 🇳🇱-ss,
        🚀 🇸🇬-ss,
        ♻️ AT,
        📌 MT,
        📶 ct-cm,
        🇨🇳 DIRECT
      ]
  }
# ######## end #######
# ######## start #######
# 链式代理Dialer-clash专用，1转-2落地-3选择node---直接配置转的，不用vps什么的转了
# 1,在节点里设置的可以落地ss,{例子{ss节点内容,"Dialer-proxy":"🇯🇵 Dialer-NODE-1"}
# 2,1转，在配置里设置🇯🇵 Dialer-NODE-1，配合节点里设置的名称。
# 3,2落，地在配置里创建Dialer-🇯🇵-2，是把订阅节点的（1）的节点导入进来的
# 4,3选择，就是正常的节点选择node,把2落的名称加入
# #  vps里中转-xui-dokodemo-door-中转机速度快的vps上搭建的，--目标节点（落地的ip）+落地端口-需要搭建个能用的节点。最后节点是中转的域名ip+端口+内容是落地机搭建的节点
# ######## start ####### 
proxy-groups:
  - { name: 🇺🇲 ss-中转切换, type: select, proxies: [♻️ 🇺🇲, ♻️ 🇯🇵, ♻️ 🇳🇱, ♻️ 🇸🇬, ♻️ 🇰🇷, ♻️ 🇭🇰, ♻️ 🇹🇼, ♻️ AT, 📌 MT ] }
  - { name: 🇯🇵 ss-中转切换, type: select, proxies: [♻️ 🇯🇵, ♻️ 🇺🇲, ♻️ 🇳🇱, ♻️ 🇸🇬, ♻️ 🇰🇷, ♻️ 🇭🇰, ♻️ 🇹🇼, ♻️ AT, 📌 MT ] }
  - { name: 🇳🇱 ss-中转切换, type: select, proxies: [♻️ 🇳🇱, ♻️ 🇸🇬, ♻️ 🇺🇲, ♻️ 🇯🇵, ♻️ 🇰🇷, ♻️ 🇭🇰, ♻️ 🇹🇼, ♻️ AT, 📌 MT ] }
  - { name: 🇸🇬 ss-中转切换, type: select, proxies: [♻️ 🇸🇬, ♻️ 🇺🇲, ♻️ 🇯🇵, ♻️ 🇳🇱, ♻️ 🇰🇷, ♻️ 🇭🇰, ♻️ 🇹🇼, ♻️ AT, 📌 MT ] }
  - { name: ♻️ AT, <<: *u, filter: "(?i)^(?!.*(东京-落地|凤凰城-落地|星岛-落地|春川-落地)).*$" }
  - { name: 📌 MT, type: select, <<: *u, proxies: [♻️ 🇺🇲, ♻️ 🇯🇵, ♻️ 🇳🇱, ♻️ 🇸🇬, ♻️ 🇰🇷, ♻️ 🇭🇰, ♻️ 🇹🇼], filter: "(?i)^(?!.*(东京-落地|凤凰城-落地|星岛-落地|春川-落地)).*$" }
  - { name: 📲 Telegram, <<: *pr }
  - { name: 🔰 other, <<: *pr }
  - { name: 🍱 gw_phone, <<: *pr }
  - { name: 🌄 emby_mz, <<: *pr }
  - { name: 📮 YouTube, <<: *pr }
  - { name: ⚡️ Cloudflare, <<: *pr }
  - { name: 📢 Google, <<: *pr }
  - { name: 🍎 Apple, <<: *pr }
  - { name: 🎮 Steam, <<: *pr }
  - { name: 🌸 IFTMP, <<: *pr }
  - { name: ⏳ Speedtest, <<: *pr }
  - { name: 🔃 dns, <<: *pr }
  - { name: 📶 ct-cm, type: select, proxies: [🔯 cmcc-f, 🔯 ctcc-f, 🌎 DIRECT] }
  - { name: 🔞 AD, type: select, proxies: [REJECT, DIRECT] }
  - { name: 🇨🇳 DIRECT, type: select, proxies: [🔯 cmcc-f, 🔯 ctcc-f, 🌎 DIRECT] }
  - { name: 🔯 cmcc-f, type: fallback, url: "http://www.baidu.com/generate_204", tolerance: 60, interval: 300, proxies: [⚡️cmcc, ⚡️ctcc] }
  - { name: 🔯 ctcc-f, type: fallback, url: "http://www.baidu.com/generate_204", tolerance: 60, interval: 300, proxies: [⚡️ctcc, ⚡️cmcc] }
  - { name: ♻️ 🇺🇲, <<: *u, filter: "(?=.*(美|🇺🇸|🇺🇲))^((?!(港|台|韩|新|日)).)*$" }
  - { name: ♻️ 🇯🇵, <<: *u, filter: "(?=.*(日|jp|🇯🇵))^((?!(港|台|韩|新|美)).)*$" }
  - { name: ♻️ 🇳🇱, <<: *u, filter: "(?=.*(🇳🇱))^((?!(港|台|韩|新|美)).)*$" }
  - { name: ♻️ 🇸🇬, <<: *u, filter: "(?=.*(新|🇸🇬))^((?!(台|日|韩|港|美)).)*$" }
  - { name: ♻️ 🇰🇷, <<: *u, filter: "(?=.*(韩|🇰🇷|kr))^((?!(台|日|港|新|美)).)*$" }
  - { name: ♻️ 🇭🇰, <<: *u, filter: "(?=.*(港|🇭🇰|hk))^((?!(台|日|韩|新|美)).)*$" }
  - { name: ♻️ 🇹🇼, <<: *u, filter: "(?=.*(台|🇹🇼|tw))^((?!(港|日|韩|新|美)).)*$" }
  - { name: 🚗 OTR, type: select, <<: *u, filter: "^(?!.*(?:🇰🇷|🇳🇱|🇭🇰|🇯🇵|🇺🇸|🇸🇬|🇨🇳|SG|JP|US|TW|韩|kr|港|hk|台|tw|🇹🇼|日|jp|新|美|us|🇺🇲|东京-落地|凤凰城-落地|星岛-落地|春川-落地)).*$" }
  - { name: 🚀 🇺🇲-ss, <<: *u, type: select, filter: "(?i)凤凰城-落地" }
  - { name: 🚀 🇯🇵-ss, <<: *u, type: select, filter: "(?i)东京-落地" }
  - { name: 🚀 🇳🇱-ss, <<: *u, type: select, filter: "(?i)春川-落地" }
  - { name: 🚀 🇸🇬-ss, <<: *u, type: select, filter: "(?i)星岛-落地" }
# ######## end #######
# ######## start #######
rules:
- RULE-SET,AWAvenue-Ads,REJECT
- RULE-SET,xmitv,REJECT
- DST-PORT,53,DNS_Hijack
- RULE-SET,private_domain,🇨🇳 DIRECT
- RULE-SET,private_ip,🇨🇳 DIRECT,no-resolve
- DOMAIN-SUFFIX,snssdk.com,🇨🇳 DIRECT
# - AND,((RULE-SET,pc_devices),(DST-PORT,53)),📶 ct-cm
# DNS 解析优化
- RULE-SET,DnsProxy_domain,🔃 dns
- RULE-SET,DnsProxy_ip,🔃 dns
# 防止 YouTube 等使用 QUIC 导致速度不佳, 禁用 443 端口 UDP 流量（不包括国内）
- AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((RULE-SET,cn_domain))),REJECT
- AND,(AND,(DST-PORT,443),(NETWORK,UDP)),(NOT,((RULE-SET,cn_ip))),REJECT

# - RULE-SET,anti-ad,REJECT
# 国际服务分流_domain
- RULE-SET,emby_mz,🌄 emby_mz
- RULE-SET,gw_phone,🍱 gw_phone
- RULE-SET,youtube_domain,📮 YouTube
- RULE-SET,google_domain,📢 Google
- RULE-SET,github_domain,🌸 IFTMP
- RULE-SET,oracle_domain,🌸 IFTMP
- RULE-SET,paypal_domain,🌸 IFTMP
- RULE-SET,openai_domain,🌸 IFTMP
- RULE-SET,mozilla_domain,🌸 IFTMP
- RULE-SET,telegram_domain,📲 Telegram
- RULE-SET,iCloud_domain,🍎 Apple
- RULE-SET,apple_domain,🍎 Apple
- RULE-SET,twitter_domain,🌸 IFTMP
- RULE-SET,instagram_domain,🌸 IFTMP
- RULE-SET,facebook_domain,🌸 IFTMP
- RULE-SET,steam_domain,🎮 Steam
- RULE-SET,onedrive_domain,🌸 IFTMP
- RULE-SET,microsoft_domain,🌸 IFTMP
- RULE-SET,speedtest_domain,⏳ Speedtest
- RULE-SET,cloudflare_domain,⚡️ Cloudflare
- RULE-SET,category-ai-!cn_domain,🌸 IFTMP

# 国际服务分流_ip
- RULE-SET,apple_ip,🍎 Apple
- RULE-SET,google_ip,📢 Google
- RULE-SET,twitter_ip,🌸 IFTMP
- RULE-SET,telegram_ip,📲 Telegram
- RULE-SET,facebook_ip,🌸 IFTMP
- RULE-SET,cloudflare_ip,⚡️ Cloudflare
- RULE-SET,gfw_domain,🔰 other
- RULE-SET,geolocation-!cn,🔰 other

# --- PC 专属规则  ---这是单台电脑用的不影响别人
- AND,((RULE-SET,pc_ip_cm_ct),(RULE-SET,cn_domain)),📶 ct-cm
- AND,((RULE-SET,pc_ip_cm_ct),(RULE-SET,cn_ip)),📶 ct-cm

- RULE-SET,cn_domain,🇨🇳 DIRECT
- RULE-SET,cn_ip,🇨🇳 DIRECT
- MATCH,🔰 other
